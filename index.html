<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VITASCIENZELAB – Bien-être & Biochimie Alimentaire</title>
  <!-- Les polices Google Fonts et les styles initiaux sont gérés par Vite à partir de src/index.css -->
</head>
<body>
  <!-- Écran de chargement initial identique à la version originale -->
  <div id="loading">
    <div style="font-size:42px">⚗️</div>
    <div class="spin"></div>
    <div style="color:#1565C0;font-weight:600;font-size:15px">VITASCIENZELAB</div>
  </div>

  <div id="root"></div>

  <!-- Point d'entrée de notre application React gérée par Vite -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Masquage de l'écran de chargement une fois l'application initialisée -->
  <script>
    setTimeout(function() {
      var l = document.getElementById("loading");
      if (l) l.style.display = "none";
    }, 300);
  </script>
</body>
</html>
