/* ══ CALENDRIER ══════════════════════════════ */
function Calendar({ selected, onSelect }) {
  const today = new Date();
  const [vy, setVy] = useState(today.getFullYear());
  const [vm, setVm] = useState(today.getMonth());

  const daysInMonth = new Date(vy, vm+1, 0).getDate();
  let firstDay = new Date(vy, vm, 1).getDay() - 1;
  if (firstDay < 0) firstDay = 6;

  const prevMonth = () => { if(vm===0){setVm(11);setVy(y=>y-1);}else setVm(m=>m-1); };
  const nextMonth = () => { if(vm===11){setVm(0);setVy(y=>y+1);}else setVm(m=>m+1); };

  const isDisabled = (d) => {
    // Build date string manually to avoid timezone shifts
    const str = `${vy}-${String(vm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const todStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    const dt = new Date(vy, vm, d, 12, 0, 0);
    return str < todStr || dt.getDay() === 0; // 0 = dimanche uniquement
  };
  const isSel = (d) => {
    if (!selected) return false;
    const str = `${vy}-${String(vm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    return selected === str;
  };
  const isToday = (d) => {
    const str = `${vy}-${String(vm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const todStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    return str === todStr;
  };
  const mkStr = (d) => `${vy}-${String(vm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  const cells = [...Array(firstDay).fill(null), ...Array.from({length:daysInMonth},(_,i)=>i+1)];

  return (
    <div style={{background:"#fff",borderRadius:16,padding:20,boxShadow:"0 2px 20px rgba(21,101,192,.08)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <button onClick={prevMonth} style={{background:LIGHT,border:"none",borderRadius:8,width:32,height:32,fontSize:18,color:BLUE}}>‹</button>
        <span style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:700,color:BLUE}}>{MOIS[vm]} {vy}</span>
        <button onClick={nextMonth} style={{background:LIGHT,border:"none",borderRadius:8,width:32,height:32,fontSize:18,color:BLUE}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>
        {JOURS.map(j=><div key={j} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#90A4AE",padding:"4px 0"}}>{j}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {cells.map((day,i) => !day ? <div key={i}/> : (
          <button
            key={i}
            disabled={isDisabled(day)}
            onClick={() => onSelect(mkStr(day))}
            style={{
              width:"100%", aspectRatio:"1", border:"none", borderRadius:8, fontSize:13,
              background: isSel(day) ? BLUE : isToday(day) ? LIGHT : "transparent",
              color: isSel(day) ? "#fff" : isDisabled(day) ? "#CFD8DC" : NAVY,
              fontWeight: isSel(day)||isToday(day) ? 700 : 400,
              outline: isToday(day)&&!isSel(day) ? `2px solid ${BLUE}` : "none",
            }}
          >{day}</button>
        ))}
      </div>
    </div>
  );
}

/* ══ AUTH PATIENT ════════════════════════════ */
function AuthPage({ onAuth, onBack }) {
  const [tab, setTab] = useState("login");
  const [form, setForm] = useState({ email:"", pw:"", prenom:"", nom:"", tel:"" });
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const set = (k) => (e) => setForm(f=>({...f,[k]:e.target.value}));

  const doLogin = async () => {
    setLoading(true); setErr("");
    try {
      if (DEMO) {
        const u = STORE.users.find(u=>u.email===form.email&&u.pw===form.pw);
        if (!u) { setErr("Email ou mot de passe incorrect"); setLoading(false); return; }
        onAuth({ id:u.id, email:u.email, prenom:u.prenom, nom:u.nom, token:"demo_"+u.id });
      } else {
        const r = await sbAuth.signIn(form.email, form.pw);
        if (r.error) { setErr(r.error.message); setLoading(false); return; }
        const m = r.user?.user_metadata||{};
        onAuth({ id:r.user.id, email:r.user.email, prenom:m.prenom||"", nom:m.nom||"", token:r.access_token });
      }
    } catch(e) { setErr("Erreur de connexion."); }
    setLoading(false);
  };

  const doRegister = async () => {
    if (!form.prenom||!form.nom||!form.email||!form.pw) { setErr("Tous les champs marqués * sont requis"); return; }
    if (form.pw.length < 6) { setErr("Mot de passe : 6 caractères minimum"); return; }
    setLoading(true); setErr("");
    try {
      if (DEMO) {
        if (STORE.users.find(u=>u.email===form.email)) { setErr("Email déjà utilisé"); setLoading(false); return; }
        const nu = { id:uid(), email:form.email, pw:form.pw, prenom:form.prenom, nom:form.nom, tel:form.tel, created_at:dateStr(0) };
        STORE.users.push(nu);
        onAuth({ id:nu.id, email:nu.email, prenom:nu.prenom, nom:nu.nom, token:"demo_"+nu.id });
      } else {
        const r = await sbAuth.signUp(form.email, form.pw, { prenom:form.prenom, nom:form.nom, tel:form.tel });
        if (r.error) { setErr(r.error.message); setLoading(false); return; }
        const m = r.user?.user_metadata||{};
        onAuth({ id:r.user.id, email:r.user.email, prenom:m.prenom||form.prenom, nom:m.nom||form.nom, token:r.access_token });
      }
    } catch(e) { setErr("Erreur lors de la création du compte."); }
    setLoading(false);
  };

  return (
    <div style={{maxWidth:420,margin:"40px auto",padding:"0 20px 60px"}}>
      <div style={{background:"#fff",borderRadius:24,padding:"36px 32px",boxShadow:"0 8px 40px rgba(21,101,192,.12)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:36,marginBottom:8}}>⚗️</div>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:NAVY,marginBottom:6}}>Espace Patient</h2>
          <p style={{color:"#78909C",fontSize:12}}>{COMPANY.name} – {COMPANY.sub}</p>
        </div>
        <div style={{display:"flex",background:"#F0F4FF",borderRadius:12,padding:4,marginBottom:24}}>
          {[["login","Se connecter"],["register","Créer un compte"]].map(([v,l])=>(
            <button key={v} onClick={()=>{setTab(v);setErr("");}} style={{flex:1,padding:"9px",border:"none",borderRadius:9,background:tab===v?"#fff":"transparent",color:tab===v?BLUE:"#90A4AE",fontWeight:tab===v?700:500,fontSize:13,boxShadow:tab===v?"0 2px 8px rgba(0,0,0,.08)":"none"}}>{l}</button>
          ))}
        </div>
        {DEMO && tab==="login" && (
          <div style={{background:"#E8F5E9",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#2E7D32"}}>
            🎭 Démo : sophie.martin@email.fr / demo123
          </div>
        )}
        {tab==="register" && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Prénom *"><Input value={form.prenom} onChange={set("prenom")} placeholder="Marie"/></Field>
            <Field label="Nom *"><Input value={form.nom} onChange={set("nom")} placeholder="Dupont"/></Field>
          </div>
        )}
        {tab==="register" && <Field label="Téléphone"><Input value={form.tel} onChange={set("tel")} placeholder="06 12 34 56 78"/></Field>}
        <Field label="Email *"><Input type="email" value={form.email} onChange={set("email")} placeholder="marie@email.com"/></Field>
        <Field label={tab==="register"?"Mot de passe * (6 car. min.)":"Mot de passe *"}><Input type="password" value={form.pw} onChange={set("pw")} placeholder="••••••••"/></Field>
        {err && <p style={{color:"#E53935",fontSize:12,textAlign:"center",marginBottom:12}}>{err}</p>}
        <PrimaryBtn onClick={tab==="login"?doLogin:doRegister} disabled={loading} style={{width:"100%",marginBottom:10}}>
          {loading ? "Chargement…" : tab==="login" ? "→ Se connecter" : "→ Créer mon compte"}

      </div>

  );
}

/* ══ ESPACE PATIENT ══════════════════════════ */
function PatientDashboard({ user, onBook, onLogout }) {
  const [rdvs, setRdvs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("upcoming");

  useEffect(() => {
    (async () => {
      setLoading(true);
      let data = [];
      try {
        if (DEMO) data = STORE.appointments.filter(a=>a.patient_id===user.id);
        else {
          const r = await db.get("appointments",`patient_id=eq.${user.id}&order=rdv_date.desc`,user.token);
          if (Array.isArray(r)) data = r;
        }
      } catch(e) {}
      setRdvs(data);
      setLoading(false);
    })();
  }, [user.id]);

  const cancel = async (rdv) => {
    if (!window.confirm("Confirmer l'annulation de cette séance ?")) return;
    if (DEMO) { const r=STORE.appointments.find(a=>a.id===rdv.id); if(r)r.status="cancelled"; }
    else await db.patch("appointments",rdv.id,{status:"cancelled"},user.token);
    setRdvs(rs => rs.map(r => r.id===rdv.id ? {...r,status:"cancelled"} : r));
  };

  const upcoming = rdvs.filter(r => !isExpired(r) && r.status==="confirmed");
  const history  = rdvs.filter(r => isExpired(r) || r.status==="completed" || r.status==="cancelled");
  const shown    = tab==="upcoming" ? upcoming : history;

  const statusBadge = (s) => {
    if (s==="confirmed") return <Badge bg="#E8F5E9" color="#2E7D32">✓ Confirmé</Badge>;
    if (s==="cancelled") return <Badge bg="#FCE4EC" color="#C62828">✗ Annulé</Badge>;
    if (s==="completed") return <Badge bg="#EDE7F6" color="#4527A0">✓ Effectué</Badge>;
    return null;
  };

  return (
    <div style={{maxWidth:700,margin:"0 auto",padding:"28px 20px 60px"}}>
      <div style={{background:`linear-gradient(135deg,${NAVY},${BLUE})`,borderRadius:20,padding:"22px 26px",marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#fff"}}>Bonjour, {user.prenom} 👋</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,.7)"}}>{user.email}</div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <PrimaryBtn onClick={onBook} style={{fontSize:13,padding:"9px 18px",background:"rgba(255,255,255,.25)",border:"1px solid rgba(255,255,255,.4)"}}>+ Nouvelle séance</PrimaryBtn>
          <button onClick={onLogout} style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"rgba(255,255,255,.8)",borderRadius:10,padding:"9px 14px",fontSize:12}}>Déconnexion</button>
        </div>
      </div>

      <div style={{display:"flex",gap:10,marginBottom:20}}>
        {[["upcoming",`À venir (${upcoming.length})`],["history",`Historique (${history.length})`]].map(([v,l])=>(
          <button key={v} onClick={()=>setTab(v)} style={{padding:"8px 18px",borderRadius:20,border:`2px solid ${tab===v?BLUE:"#E0E0E0"}`,background:tab===v?BLUE:"#fff",color:tab===v?"#fff":"#546E7A",fontSize:13,fontWeight:600}}>{l}</button>
        ))}
      </div>

      {loading ? <Spinner/> : shown.length===0 ? (
        <div style={{textAlign:"center",padding:"40px 20px",color:"#90A4AE"}}>
          {tab==="upcoming" ? (
            <><div style={{fontSize:40,marginBottom:12}}>📅</div><p style={{marginBottom:16}}>Aucune séance à venir.</p><PrimaryBtn onClick={onBook}>Réserver une séance</PrimaryBtn></>
          ) : <p>Aucun historique de séance.</p>}
        </div>
      ) : shown.map(rdv => (
        <div key={rdv.id} style={{background:"#fff",borderRadius:16,padding:"18px 20px",marginBottom:12,boxShadow:"0 2px 12px rgba(21,101,192,.06)",borderLeft:`4px solid ${rdv.status==="cancelled"?"#FFCDD2":isExpired(rdv)?"#B0BEC5":BLUE}`,opacity:rdv.status==="cancelled"?.7:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                <span style={{fontSize:20}}>{rdv.service_icon}</span>
                <span style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:NAVY}}>{rdv.service_title}</span>
                {statusBadge(rdv.status)}
                {rdv.recurring && <Badge bg="#FFF8E1" color="#F57F17">🔁 Mensuel</Badge>}
              </div>
              <div style={{fontSize:13,color:"#546E7A"}}>📅 {fmtLong(rdv.rdv_date)} · 🕐 {rdv.slot} · ⏱ {rdv.service_dur}</div>
              {rdv.docs?.length > 0 && (
                <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
                  {rdv.docs.map(d=><Badge key={d} bg="#F3E5F5" color="#6A1B9A">📎 {d}</Badge>)}
                </div>
              )}
            </div>
            {rdv.status==="confirmed" && !isExpired(rdv) && (
              <button onClick={()=>cancel(rdv)} style={{background:"#FCE4EC",border:"none",color:"#C62828",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:600}}>Annuler</button>
            )}
          </div>
          {rdv.status==="confirmed" && !isExpired(rdv) && (
            <div style={{marginTop:10,padding:"10px 12px",background:"#FFF8E1",borderRadius:8,fontSize:12,color:"#E65100"}}>
              📎 N'oubliez pas d'apporter vos documents médicaux si vous en disposez.
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ══ QUESTIONNAIRE BIEN-ÊTRE ═════════════════ */
function QuestionnaireStep({ answers, setAnswers, step, onNext, onPrev }) {
  const q = QUESTIONS[step];
  const val = answers[q.k] || "";
  const set = (v) => setAnswers(a=>({...a,[q.k]:v}));

  return (
    <div style={{background:"#fff",borderRadius:16,padding:26,boxShadow:"0 2px 20px rgba(21,101,192,.08)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <span style={{fontSize:12,color:"#90A4AE"}}>Question {step+1} / {QUESTIONS.length}</span>
        <div style={{background:"#E3F0FF",borderRadius:20,height:6,width:180,overflow:"hidden"}}>
          <div style={{height:"100%",background:BLUE,width:`${((step+1)/QUESTIONS.length)*100}%`,transition:"width .3s"}}/>
        </div>
      </div>
      <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:17,color:NAVY,marginBottom:18,lineHeight:1.4}}>{q.q}</h3>

      {q.type==="radio" && q.opts.map(o=>(
        <div key={o} onClick={()=>set(o)} style={{padding:"11px 14px",borderRadius:10,border:`2px solid ${val===o?BLUE:LIGHT}`,background:val===o?"#E8F0FE":"#fff",marginBottom:8,cursor:"pointer",fontSize:13,color:NAVY,fontWeight:val===o?700:400,transition:"all .15s"}}>
          {val===o?"◉ ":"○ "}{o}
        </div>
      ))}
      {q.type==="scale" && (
        <div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#90A4AE",marginBottom:10}}>
            <span>Très faible</span><span>Excellent</span>
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center"}}>
            {[1,2,3,4,5].map(n=>(
              <button key={n} onClick={()=>set(String(n))} style={{width:50,height:50,borderRadius:12,border:`2px solid ${val===String(n)?BLUE:LIGHT}`,background:val===String(n)?BLUE:"#fff",color:val===String(n)?"#fff":NAVY,fontSize:16,fontWeight:700}}>
                {n}
              </button>
            ))}
          </div>
        </div>
      )}
      {q.type==="text" && (
        <textarea value={val} onChange={e=>set(e.target.value)} placeholder={q.ph} style={{width:"100%",border:`2px solid ${LIGHT}`,borderRadius:10,padding:"11px 13px",fontSize:13,color:NAVY,outline:"none",background:"#FAFCFF",minHeight:80,resize:"vertical"}}/>
      )}

      <div style={{display:"flex",justifyContent:"space-between",marginTop:20,gap:10}}>
        {step > 0 ? <SecBtn onClick={onPrev}>← Précédent</SecBtn> : <div/>}
        <PrimaryBtn onClick={onNext} disabled={!val}>{step < QUESTIONS.length-1 ? "Suivant →" : "Terminer →"}</PrimaryBtn>
      </div>
    </div>
  );
}

/* ══ RÉSERVATION (6 étapes) ══════════════════ */
const BOOKING_STEPS = ["Service","Date","Créneau","Documents","Questionnaire","Vos infos","Confirmation"];

function BookingFlow({ user, onDone }) {
  const [step, setStep]       = useState(0);
  const [svc, setSvc]         = useState(null);
  const [date, setDate]       = useState("");
  const [slot, setSlot]       = useState("");
  const [docs, setDocs]       = useState([]);
  const [qStep, setQStep]     = useState(0);
  const [qAns, setQAns]       = useState({});
  const [recurring, setRecurring] = useState(false);
  const [form, setForm]       = useState({ prenom:user?.prenom||"", nom:user?.nom||"", email:user?.email||"", tel:"", notes:"" });
  const [consent, setConsent] = useState(false);
  const [errs, setErrs]       = useState({});
  const [loading, setLoading] = useState(false);
  const [done, setDone]       = useState(null);
  const [showLegal, setShowLegal] = useState(false);
  const [showEmail, setShowEmail] = useState(false);
  const fileRef = useRef();
  const set = (k) => (e) => setForm(f=>({...f,[k]:e.target.value}));

  const goQ = (dir) => {
    const next = qStep + dir;
    if (next >= QUESTIONS.length) setStep(5);
    else if (next < 0) setStep(3);
    else setQStep(next);
  };

  const validate = () => {
    const e = {};
    if (!form.prenom.trim()) e.prenom="Requis";
    if (!form.nom.trim()) e.nom="Requis";
    if (!form.email.match(/^[^@]+@[^@]+\.[^@]+$/)) e.email="Email invalide";
    if (!form.tel.match(/^[\d\s\+\-\.\(\)]{8,}$/)) e.tel="Invalide";
    if (!consent) e.consent="Veuillez accepter les conditions";
    setErrs(e);
    return Object.keys(e).length === 0;
  };

  const confirm = async () => {
    if (!validate()) return;
    setLoading(true);
    const rdv = {
      id: genId(),
      patient_id: user?.id || null,
      patient_name: `${form.prenom} ${form.nom}`,
      patient_email: form.email,
      patient_tel: form.tel,
      service_id: svc.id,
      service_title: svc.title,
      service_icon: svc.icon,
      service_dur: svc.dur,
      rdv_date: date,
      slot,
      status: "confirmed",
      notes: form.notes,
      recurring,
      docs: docs.map(d=>d.name),
      reminder_sent: false,
      created_at: dateStr(0),
    };
    try {
      if (DEMO) {
        STORE.appointments.push(rdv);
        if (Object.keys(qAns).length > 0) {
          STORE.questionnaires.push({ id:uid(), appointment_id:rdv.id, patient_id:user?.id||null, responses:qAns, created_at:dateStr(0) });
        }
      } else {
        await db.post("appointments", rdv, user?.token);
        if (Object.keys(qAns).length > 0) {
          await db.post("questionnaires", { appointment_id:rdv.id, patient_id:user?.id||null, responses:qAns }, user?.token);
        }
      }
    } catch(e) {}
    setDone(rdv);
    setLoading(false);
  };

  if (done) return (
    <div style={{maxWidth:540,margin:"40px auto",padding:"0 20px 60px"}}>
      {showLegal && <LegalModal onClose={()=>setShowLegal(false)}/>}
      {showEmail && <EmailModal rdv={done} type="confirm" onClose={()=>setShowEmail(false)}/>}
      <div style={{background:"#fff",borderRadius:24,padding:"40px 32px",boxShadow:"0 8px 40px rgba(21,101,192,.12)",textAlign:"center"}}>
        <div style={{width:68,height:68,borderRadius:"50%",background:`linear-gradient(135deg,${BLUE},#42A5F5)`,margin:"0 auto 18px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,color:"#fff"}}>✓</div>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:NAVY,marginBottom:10}}>Séance confirmée !</h2>
        <p style={{color:"#78909C",fontSize:13,lineHeight:1.7,marginBottom:24}}>Un email de confirmation a été envoyé à <strong>{form.email}</strong>.<br/>Vous recevrez un rappel <strong>48h avant</strong> votre séance.</p>
        <div style={{background:"#F0F4FF",borderRadius:14,padding:20,textAlign:"left",marginBottom:16}}>
          {[["Référence",done.id],["Prestation",svc.title],["Date",fmtLong(date)],["Heure",slot],["Durée",svc.dur]].map(([l,v])=>(
            <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #E8EEFF",fontSize:13}}>
              <span style={{color:"#78909C"}}>{l}</span>
              <span style={{fontWeight:700,color:NAVY,fontFamily:l==="Référence"?"monospace":"inherit"}}>{v}</span>
            </div>
          ))}
          {recurring && <div style={{padding:"8px 0",fontSize:12,color:"#F57F17"}}>🔁 Suivi mensuel programmé</div>}
        </div>
        <div style={{background:"#FFF8E1",borderRadius:10,padding:"12px 14px",marginBottom:20,textAlign:"left",fontSize:12,color:"#E65100",lineHeight:1.6}}>
          📎 <strong>Le jour J :</strong> Pensez à apporter tout document médical utile (bilan sanguin, ordonnance…). Non obligatoire, mais très précieux pour votre suivi.
        </div>
        <div style={{display:"flex",gap:10}}>
          <SecBtn onClick={()=>setShowEmail(true)} style={{flex:1,fontSize:13}}>📧 Aperçu email</SecBtn>
          <PrimaryBtn onClick={onDone} style={{flex:2}}>{user ? "Voir mes séances →" : "Retour accueil"}</PrimaryBtn>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      {showLegal && <LegalModal onClose={()=>setShowLegal(false)}/>}
      {/* Barre de progression */}
      <div style={{background:"#fff",borderBottom:"1px solid #E3F0FF",padding:"0 20px"}}>
        <div style={{maxWidth:800,margin:"0 auto",display:"flex",alignItems:"center",padding:"12px 0",overflowX:"auto",gap:0}}>
          {BOOKING_STEPS.map((s,i)=>(
            <div key={s} style={{display:"flex",alignItems:"center",flex:i<BOOKING_STEPS.length-1?1:"none"}}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,flexShrink:0}}>
                <div style={{width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:i<step?BLUE:i===step?BLUE:"#E3F0FF",color:i<=step?"#fff":"#90A4AE",fontSize:11,fontWeight:700}}>
                  {i < step ? "✓" : i+1}
                </div>
                <span style={{fontSize:9,color:i<=step?BLUE:"#90A4AE",fontWeight:i===step?700:400,whiteSpace:"nowrap"}}>{s}</span>
              </div>
              {i < BOOKING_STEPS.length-1 && <div style={{flex:1,height:2,background:i<step?BLUE:"#E3F0FF",margin:"0 4px 16px",minWidth:8}}/>}
            </div>
          ))}
        </div>
      </div>

      <div style={{maxWidth:800,margin:"0 auto",padding:"28px 20px 80px"}}>

        {/* ÉTAPE 0 — SERVICE */}
        {step===0 && (
          <div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:NAVY,marginBottom:8}}>Choisissez votre séance</h2>
            <p style={{color:"#78909C",fontSize:13,marginBottom:20}}>{COMPANY.owner} · {COMPANY.role}</p>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {SERVICES.map(s=>(
                <div key={s.id} onClick={()=>{setSvc(s);setStep(1);}} style={{background:"#fff",borderRadius:16,padding:"20px 22px",border:`2px solid ${svc?.id===s.id?BLUE:LIGHT}`,cursor:"pointer",display:"flex",alignItems:"center",gap:16,boxShadow:"0 2px 12px rgba(21,101,192,.06)",transition:"all .2s"}}>
                  <div style={{fontSize:32,minWidth:40,textAlign:"center"}}>{s.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
                      <span style={{fontFamily:"'Playfair Display',serif",fontSize:17,color:NAVY}}>{s.title}</span>
                      <Badge>{s.dur}</Badge>
                    </div>
                    <p style={{color:"#90A4AE",fontSize:12,lineHeight:1.5}}>{s.desc}</p>
                  </div>
                  <span style={{color:BLUE,fontSize:20}}>›</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ÉTAPE 1 — DATE */}
        {step===1 && (
          <div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:NAVY,marginBottom:8}}>Choisissez une date</h2>
            <p style={{color:"#78909C",fontSize:13,marginBottom:20}}>{svc?.title} · Les dimanches ne sont pas disponibles</p>
            <Calendar selected={date} onSelect={d=>{setDate(d);setSlot("");}}/>

              {[["📅 Date",fmtLong(date)],["🕐 Heure",slot],["👤 Nom",`${form.prenom} ${form.nom}`],["📧 Email",form.email],["📞 Tél.",form.tel]].map(([l,v])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:`1px solid #F0F4FF`,fontSize:13}}>
                  <span style={{color:"#78909C"}}>{l}</span>
                  <span style={{fontWeight:600,color:NAVY}}>{v}</span>

              {docs.length > 0 && (
                <div style={{paddingTop:12,display:"flex",gap:8,flexWrap:"wrap"}}>
                  {docs.map((d,i)=><Badge key={i} bg="#F3E5F5" color="#6A1B9A">📎 {d.name}</Badge>)}

              {Object.keys(qAns).length > 0 && (
                <div style={{marginTop:12,padding:"10px 12px",background:"#F0F4FF",borderRadius:8,fontSize:12,color:"#546E7A"}}>

                </div>

            </div>
            <div style={{background:"#FFF8E1",border:"1px solid #FFD54F",borderRadius:12,padding:"14px 16px",marginBottom:14,fontSize:12,color:"#BF360C",lineHeight:1.6}}>
              📎 <strong>Le jour de la séance :</strong> Pensez à apporter tout document médical utile (bilan sanguin, ordonnances). Non obligatoire mais très précieux.
            </div>
            <div style={{background:"#fff",borderRadius:12,padding:"16px 18px",boxShadow:"0 2px 12px rgba(21,101,192,.06)",marginBottom:16}}>

                <input type="checkbox" checked={consent} onChange={e=>setConsent(e.target.checked)} style={{marginTop:3,accentColor:BLUE,width:15,height:15,flexShrink:0}}/>
                <span style={{fontSize:12,color:"#546E7A",lineHeight:1.7}}>
                  J'ai pris connaissance que les séances de VITASCIENZELAB s'inscrivent exclusivement dans le cadre du <strong>bien-être et du conseil en biochimie alimentaire</strong>. Elles ne constituent pas un acte médical et ne remplacent pas l'avis d'un médecin. J'accepte les{" "}
                  <button onClick={e=>{e.preventDefault();setShowLegal(true);}} style={{background:"none",border:"none",color:BLUE,textDecoration:"underline",cursor:"pointer",fontSize:12,padding:0}}>mentions légales</button>.
                </span>
              </label>
              {errs.consent && <span style={{fontSize:11,color:"#E53935",display:"block",marginTop:6}}>{errs.consent}</span>}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",gap:12}}>
              <SecBtn onClick={()=>setStep(5)}>← Modifier</SecBtn>
              <PrimaryBtn onClick={confirm} disabled={loading} style={{background:`linear-gradient(135deg,${BLUE},${NAVY})`}}>
                {loading ? "Enregistrement…" : "✓ Confirmer ma séance"}

        )}

      </div>
    </div>
  );
}

/* ══ ADMIN ═══════════════════════════════════ */
function AdminDashboard({ onBack }) {
  const [authed, setAuthed]   = useState(false);
  const [pass, setPass]       = useState("");
  const [passErr, setPassErr] = useState(false);
  const [tab, setTab]         = useState("agenda");
  const [rdvs, setRdvs]       = useState([]);
  const [patients, setPatients] = useState([]);
  const [blocked, setBlocked] = useState([]);
  const [selPat, setSelPat]   = useState(null);
  const [patRdvs, setPatRdvs] = useState([]);
  const [patNotes, setPatNotes] = useState([]);
  const [patQ, setPatQ]       = useState([]);
  const [newNote, setNewNote] = useState("");
  const [weekOff, setWeekOff] = useState(0);
  const [emailModal, setEmailModal] = useState(null);
  const [emailType, setEmailType]   = useState("confirm");
  const [search, setSearch]   = useState("");
  const [filter, setFilter]   = useState("all");
  const [newBlock, setNewBlock] = useState({ date:"", slot:"", reason:"" });
  const [gToken,    setGToken]    = useState(null);
  const [gConnected,setGConnected]= useState(false);
  const [gSyncing,  setGSyncing]  = useState(false);
  const [gSyncedIds,setGSyncedIds]= useState([]);
  const [gError,    setGError]    = useState("");
  const [manualRdv, setManualRdv] = useState({ prenom:"", nom:"", email:"", tel:"", service_id:"conseil", rdv_date:"", slot:"", notes:"", recurring:false });
  const [manualErr, setManualErr] = useState({});
  const [manualOk, setManualOk]  = useState(false);
  const [manualLoading, setManualLoading] = useState(false);
  const ADMIN = "VitaAdmin2024";

  useEffect(()=>{
    if (!authed) return;
    if (DEMO) {
      setRdvs([...STORE.appointments]);
      setPatients([...STORE.users]);
      setBlocked([...STORE.blocked]);
    } else {
      Promise.all([
        db.get("appointments","order=rdv_date.asc",SB_KEY),
        db.get("profiles","order=created_at.desc",SB_KEY),
        db.get("blocked_slots","order=blocked_date.asc",SB_KEY)
      ]).then(([r,p,b])=>{
        if(Array.isArray(r))setRdvs(r);
        if(Array.isArray(p))setPatients(p);
        if(Array.isArray(b))setBlocked(b);
      }).catch(e=>console.error("Admin load error:",e));
    }
  },[authed]);

  const openPat = (pt) => {
    setSelPat(pt);
    if (DEMO) {
      setPatRdvs(STORE.appointments.filter(a=>a.patient_id===pt.id));
      setPatNotes(STORE.notes.filter(n=>n.patient_id===pt.id));
      setPatQ(STORE.questionnaires.filter(q=>q.patient_id===pt.id));
    } else {
      Promise.all([db.get("appointments",`patient_id=eq.${pt.id}&order=rdv_date.desc`),db.get("admin_notes",`patient_id=eq.${pt.id}&order=created_at.desc`),db.get("questionnaires",`patient_id=eq.${pt.id}&order=created_at.desc`)])
        .then(([r,n,q])=>{ if(Array.isArray(r))setPatRdvs(r); if(Array.isArray(n))setPatNotes(n); if(Array.isArray(q))setPatQ(q); });
    }
    setTab("fiche");
  };

  const addNote = async () => {
    if (!newNote.trim()) return;
    const n = { id:uid(), patient_id:selPat.id, note:newNote, created_at:dateStr(0) };
    if (DEMO) STORE.notes.push(n);
    else await db.post("admin_notes", n, SB_KEY);
    setPatNotes(ns=>[n,...ns]);
    setNewNote("");
  };

  const markSent = (rdv) => {
    if (DEMO) { const r=STORE.appointments.find(a=>a.id===rdv.id); if(r)r.reminder_sent=true; }
    else db.patch("appointments",rdv.id,{reminder_sent:true},SB_KEY);
    setRdvs(rs=>rs.map(r=>r.id===rdv.id?{...r,reminder_sent:true}:r));
  };

  const addBlock = () => {
    if (!newBlock.date) return;
    const b = { id:uid(), ...newBlock, created_at:dateStr(0) };
    if (DEMO) STORE.blocked.push(b);
    else db.post("blocked_slots",b,SB_KEY);
    setBlocked(bs=>[...bs,b]);
    setNewBlock({date:"",slot:"",reason:""});
  };

  const delBlock = (id) => {
    if (DEMO) STORE.blocked = STORE.blocked.filter(b=>b.id!==id);
    else db.del("blocked_slots",id,SB_KEY);
    setBlocked(bs=>bs.filter(b=>b.id!==id));
  };

  /* ── GOOGLE CALENDAR FUNCTIONS ─────────────── */
  const loadGoogleScript = () => new Promise((resolve) => {
    if (window.google?.accounts) { resolve(); return; }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = resolve;
    document.head.appendChild(s);
  });

  /* ── EXPORT ICS (fonctionne partout, même sans déploiement) ─ */
  const toICSDate = (dateStr, slot) => {
    const [h, m] = slot.split(":").map(Number);
    const d = new Date(dateStr + "T00:00:00");
    d.setHours(h, m, 0, 0);
    return d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  };

  const downloadICS = (rdvList) => {
    const events = rdvList.map(rdv => {
      const dur = SVC_DURATION[rdv.service_id] || 45;
      const start = toICSDate(rdv.rdv_date, rdv.slot);
      const [h, m] = rdv.slot.split(":").map(Number);
      const endD = new Date(rdv.rdv_date + "T00:00:00");
      endD.setHours(h, m + dur, 0, 0);
      const end = endD.toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
      return [
        "BEGIN:VEVENT",
        `UID:${rdv.id}@vitascienzelab.fr`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
        `DTSTART:${start}`,
        `DTEND:${end}`,
        `SUMMARY:${rdv.service_icon} ${rdv.patient_name} — ${rdv.service_title}`,
        `LOCATION:9 Rue du Champ Pile\, 10320 Bouilly (Aube)`,
        `DESCRIPTION:Patient : ${rdv.patient_name}\nEmail : ${rdv.patient_email}\nTél : ${rdv.patient_tel}\nNotes : ${rdv.notes || "—"}\nRéf : ${rdv.id}`,
        "BEGIN:VALARM",
        "TRIGGER:-PT24H",
        "ACTION:DISPLAY",
        "DESCRIPTION:Rappel séance demain",
        "END:VALARM",
        "END:VEVENT",
      ].join("\r\n");
    });
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//VITASCIENZELAB//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH", ...events, "END:VCALENDAR"].join("\r\n");
    const blob = new Blob([ics], { type:"text/calendar;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = "vitascienzelab-seances.ics"; a.click();
    URL.revokeObjectURL(url);
  };

  const connectGoogle = async () => {
    setGError("");
    try {
      await loadGoogleScript();
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: GCAL_CLIENT_ID,
        scope: GCAL_SCOPE,
        callback: (resp) => {
          if (resp.error) { setGError("Connexion Google refusée : " + resp.error); return; }
          setGToken(resp.access_token);
          setGConnected(true);
        },
      });
      client.requestAccessToken();
    } catch(e) { setGError("Erreur lors de la connexion Google."); }
  };

  const buildGCalEvent = (rdv) => {
    const dur = SVC_DURATION[rdv.service_id] || 45;
    const [h, m] = rdv.slot.split(":").map(Number);
    const start = new Date(rdv.rdv_date + "T00:00:00");
    start.setHours(h, m, 0, 0);
    const end = new Date(start.getTime() + dur * 60000);
    return {
      summary: `${rdv.service_icon} ${rdv.patient_name} — ${rdv.service_title}`,
      location: "9 Rue du Champ Pile, 10320 Bouilly (Aube)",
      description: `Patient : ${rdv.patient_name}\nEmail : ${rdv.patient_email}\nTél : ${rdv.patient_tel}\nNotes : ${rdv.notes || "—"}\n\nRéf. : ${rdv.id}\n\nSecrétariat VITASCIENZELAB – Herboristerie Champenoise`,
      start: { dateTime: start.toISOString(), timeZone: "Europe/Paris" },
      end:   { dateTime: end.toISOString(),   timeZone: "Europe/Paris" },
      colorId: rdv.service_id==="conseil" ? "1" : rdv.service_id==="suivi" ? "2" : "6",
      reminders: { useDefault:false, overrides:[{ method:"email", minutes:1440 },{ method:"popup", minutes:60 }] },
    };
  };

  const syncOneToGCal = async (rdv) => {
    if (!gToken) { setGError("Connectez d'abord votre Google Agenda."); return false; }
    try {
      const resp = await fetch(GCAL_API, {
        method:"POST",
        headers:{ "Authorization":`Bearer ${gToken}`, "Content-Type":"application/json" },
        body: JSON.stringify(buildGCalEvent(rdv)),
      });
      if (resp.ok) { setGSyncedIds(ids => [...ids, rdv.id]); return true; }
      const err = await resp.json();
      if (err.error?.code === 401) { setGConnected(false); setGToken(null); setGError("Session Google expirée. Reconnectez-vous."); }
      return false;
    } catch(e) { setGError("Erreur réseau Google Calendar."); return false; }
  };

  const syncAllUpcoming = async () => {
    if (!gToken) { setGError("Connectez d'abord votre Google Agenda."); return; }
    setGSyncing(true); setGError("");
    const upcoming = rdvs.filter(r => !isExpired(r) && r.status==="confirmed" && !gSyncedIds.includes(r.id));
    let ok = 0;
    for (const rdv of upcoming) { const success = await syncOneToGCal(rdv); if (success) ok++; }
    setGSyncing(false);
    if (ok > 0) setGError(`✅ ${ok} séance${ok>1?"s":""} synchronisée${ok>1?"s":""} !`);
  };

  const saveManualRdv = async () => {
    const e = {};
    if (!manualRdv.prenom.trim()) e.prenom = "Requis";
    if (!manualRdv.nom.trim())    e.nom    = "Requis";
    if (!manualRdv.rdv_date)      e.rdv_date = "Requis";
    if (!manualRdv.slot)          e.slot   = "Requis";
    if (!manualRdv.email.match(/^[^@]+@[^@]+\.[^@]+$/) && manualRdv.email) e.email = "Email invalide";
    setManualErr(e);
    if (Object.keys(e).length > 0) return;
    setManualLoading(true);
    const svc = SERVICES.find(s => s.id === manualRdv.service_id);
    const rdv = {
      id: genId(),
      patient_id: null,
      patient_name: `${manualRdv.prenom} ${manualRdv.nom}`,
      patient_email: manualRdv.email || "—",
      patient_tel: manualRdv.tel || "—",
      service_id: svc.id, service_title: svc.title, service_icon: svc.icon, service_dur: svc.dur,
      rdv_date: manualRdv.rdv_date, slot: manualRdv.slot,
      status: "confirmed", notes: manualRdv.notes,
      recurring: manualRdv.recurring, docs: [], reminder_sent: false,
      created_at: new Date().toISOString(),
    };
    try {
      if (DEMO) STORE.appointments.push(rdv);
      else await db.post("appointments", rdv, SB_KEY);
      setRdvs(rs => [...rs, rdv]);
      setManualOk(true);
      setManualRdv({ prenom:"", nom:"", email:"", tel:"", service_id:"conseil", rdv_date:"", slot:"", notes:"", recurring:false });
      setTimeout(() => setManualOk(false), 4000);
      if (gToken) await syncOneToGCal(rdv);
    } catch(err) { console.error(err); }
    setManualLoading(false);
  };

  const deleteRdv = async (rdv) => {
    if (!window.confirm(`Supprimer définitivement le RDV de ${rdv.patient_name} (${fmtShort(rdv.rdv_date)} à ${rdv.slot}) ?

Cette action est irréversible.`)) return;
    try {
      if (DEMO) STORE.appointments = STORE.appointments.filter(a => a.id !== rdv.id);
      else await db.del("appointments", rdv.id, SB_KEY);
      setRdvs(rs => rs.filter(r => r.id !== rdv.id));
    } catch(e) { console.error(e); }
  };

  const reminder48 = rdvs.filter(need48);
  const filteredRdvs = rdvs
    .filter(r => {
      if (filter==="upcoming") return !isExpired(r)&&r.status==="confirmed";
      if (filter==="today") { const h=hUntil(r.rdv_date,r.slot); return h!==null&&h>=0&&h<24; }
      if (filter==="reminder") return need48(r);
      if (filter==="cancelled") return r.status==="cancelled";
      return true;
    })
    .filter(r => !search || `${r.patient_name} ${r.patient_email}`.toLowerCase().includes(search.toLowerCase()));

  const weekDates = Array.from({length:7},(_,i)=>{
    const today=new Date();
    const dow=today.getDay();
    const mon=new Date(today);
    mon.setDate(today.getDate()-(dow===0?6:dow-1)+(weekOff*7));
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);
    return d;
  });

  const stats = {
    total: rdvs.length,
    upcoming: rdvs.filter(r=>!isExpired(r)&&r.status==="confirmed").length,
    patients: patients.length,
    withDocs: rdvs.filter(r=>r.docs?.length>0).length,
    recurring: rdvs.filter(r=>r.recurring).length,
    byService: SERVICES.map(s=>({ ...s, count:rdvs.filter(r=>r.service_id===s.id).length })),
    monthly: Array.from({length:6},(_,i)=>{
      const d=new Date(); d.setMonth(d.getMonth()-5+i);
      const m=d.toISOString().slice(0,7);
      return { label:MOIS[d.getMonth()].slice(0,3), count:rdvs.filter(r=>r.rdv_date?.startsWith(m)).length };
    }),
  };

  if (!authed) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"linear-gradient(180deg,#EBF0FE,#F8FAFF)"}}>
      <style>{G}</style>
      <div style={{background:"#fff",borderRadius:20,padding:40,maxWidth:380,width:"100%",boxShadow:"0 8px 40px rgba(21,101,192,.12)",textAlign:"center"}}>
        <div style={{fontSize:36,marginBottom:12}}>🔐</div>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:NAVY,marginBottom:6}}>Espace Administrateur</h2>
        <p style={{color:"#78909C",fontSize:12,marginBottom:22}}>VITASCIENZELAB – Accès restreint</p>
        <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(pass===ADMIN?setAuthed(true):setPassErr(true))} placeholder="Mot de passe" style={{width:"100%",border:`2px solid ${passErr?"#E53935":LIGHT}`,borderRadius:10,padding:"11px 13px",fontSize:13,color:NAVY,outline:"none",textAlign:"center",letterSpacing:6,marginBottom:8}}/>
        {passErr && <p style={{color:"#E53935",fontSize:12,marginBottom:8}}>Mot de passe incorrect</p>}
        <PrimaryBtn onClick={()=>pass===ADMIN?setAuthed(true):setPassErr(true)} style={{width:"100%",marginBottom:10}}>Accéder</PrimaryBtn>
        <SecBtn onClick={onBack} style={{width:"100%"}}>← Retour</SecBtn>
      </div>
    </div>
  );

  const TABS = [["agenda","📅 Agenda"],["nouveau","✏️ Nouveau RDV"],["gcal","📆 Google Agenda"],["rdvs","📋 Séances"],["patients","👥 Patients"],["stats","📊 Statistiques"],["dispo","🔒 Disponibilités"]];
  const inIS = {width:"100%",border:`2px solid ${LIGHT}`,borderRadius:10,padding:"9px 12px",fontSize:12,color:NAVY,outline:"none"};

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(180deg,#EBF0FE,#F8FAFF)"}}>
      <style>{G}</style>
      {emailModal && <EmailModal rdv={emailModal} type={emailType} onClose={()=>setEmailModal(null)}/>}
      <div style={{background:`linear-gradient(135deg,${NAVY},${BLUE})`,padding:"0 20px",position:"sticky",top:0,zIndex:100}}>

          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,borderRadius:9,background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>⚗️</div>
            <div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:14,color:"#fff",fontWeight:700}}>VITASCIENZELAB</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,.6)"}}>Tableau de bord</div>
            </div>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {TABS.map(([v,l])=>(

          </div>

        </div>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"22px 20px 60px"}}>
        {reminder48.length > 0 && tab!=="fiche" && (
          <div style={{background:"linear-gradient(135deg,#FFF8E1,#FFF3E0)",border:"1px solid #FFB300",borderRadius:14,padding:"14px 18px",marginBottom:20,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <span style={{fontSize:22}}>⏰</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,color:"#E65100",fontSize:13}}>Rappels 48h à envoyer ({reminder48.length})</div>

            <div style={{display:"flex",gap:8}}>

            </div>
          </div>

        {/* AGENDA */}
        {/* ─ NOUVEAU RDV MANUEL ─ */}
        {tab==="nouveau" && (
          <div>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
              <div style={{width:44,height:44,borderRadius:12,background:`linear-gradient(135deg,${BLUE},${NAVY})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✏️</div>
              <div>
                <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:NAVY,margin:0}}>Ajouter un rendez-vous manuellement</h3>
                <p style={{fontSize:12,color:"#78909C",margin:0}}>Le créneau sera automatiquement bloqué pour les patients</p>
              </div>

            {manualOk && (

                </div>
              </div>

              {/* SÉANCE */}
              <p style={{fontSize:11,fontWeight:700,color:BLUE,letterSpacing:1,marginBottom:14}}>📅 SÉANCE</p>
              <div style={{marginBottom:12}}>
                <label style={{display:"block",fontSize:12,fontWeight:600,color:NAVY,marginBottom:5}}>Type de séance *</label>
                <select value={manualRdv.service_id} onChange={e=>setManualRdv(r=>({...r,service_id:e.target.value}))} style={{width:"100%",border:`2px solid ${LIGHT}`,borderRadius:10,padding:"10px 12px",fontSize:13,color:NAVY,outline:"none",background:"#FAFCFF"}}>
                  {SERVICES.map(s=><option key={s.id} value={s.id}>{s.icon} {s.title} ({s.dur})</option>)}
                </select>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                <div>
                  <label style={{display:"block",fontSize:12,fontWeight:600,color:NAVY,marginBottom:5}}>Date * <span style={{fontWeight:400,color:"#90A4AE"}}>(lun.–sam.)</span></label>
                  <input type="date" value={manualRdv.rdv_date} onChange={e=>setManualRdv(r=>({...r,rdv_date:e.target.value}))} min={new Date().toISOString().split("T")[0]} style={{width:"100%",border:`2px solid ${manualErr.rdv_date?"#E53935":LIGHT}`,borderRadius:10,padding:"10px 12px",fontSize:13,color:NAVY,outline:"none"}}/>
                  {manualErr.rdv_date && <span style={{fontSize:11,color:"#E53935"}}>{manualErr.rdv_date}</span>}
                </div>
                <div>
                  <label style={{display:"block",fontSize:12,fontWeight:600,color:NAVY,marginBottom:5}}>Créneau * <span style={{fontWeight:400,color:"#90A4AE"}}>(14h–19h)</span></label>
                  <select value={manualRdv.slot} onChange={e=>setManualRdv(r=>({...r,slot:e.target.value}))} style={{width:"100%",border:`2px solid ${manualErr.slot?"#E53935":LIGHT}`,borderRadius:10,padding:"10px 12px",fontSize:13,color:NAVY,outline:"none",background:"#FAFCFF"}}>
                    <option value="">-- Choisir --</option>
                    {SLOTS.map(s=>{
                      const taken = rdvs.find(r=>r.rdv_date===manualRdv.rdv_date&&r.slot===s&&r.status==="confirmed");
                      return <option key={s} value={s} disabled={!!taken}>{s}{taken?" — déjà réservé":""}</option>;
                    })}
                  </select>
                  {manualErr.slot && <span style={{fontSize:11,color:"#E53935"}}>{manualErr.slot}</span>}
                </div>
              </div>

              {/* APERÇU CRÉNEAUX DU JOUR */}
              {manualRdv.rdv_date && (
                <div style={{background:"#F8FAFF",borderRadius:12,padding:"14px 16px",marginBottom:12,border:`1px solid ${LIGHT}`}}>
                  <p style={{fontSize:11,fontWeight:700,color:NAVY,marginBottom:10}}>
                    Vue des créneaux — {new Date(manualRdv.rdv_date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
                  </p>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {SLOTS.map(s=>{
                      const taken = rdvs.find(r=>r.rdv_date===manualRdv.rdv_date&&r.slot===s&&r.status==="confirmed");
                      return (
                        <div key={s} onClick={()=>!taken&&setManualRdv(r=>({...r,slot:s}))} style={{padding:"7px 12px",borderRadius:8,fontSize:12,fontWeight:600,cursor:taken?"not-allowed":"pointer",background:manualRdv.slot===s?BLUE:taken?"#FCE4EC":"#E8F0FE",color:manualRdv.slot===s?"#fff":taken?"#C62828":BLUE,textDecoration:taken?"line-through":"none",userSelect:"none"}}>
                          {s}{taken?` (${taken.patient_name?.split(" ")[0]})` : ""}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              <div style={{marginBottom:12}}>
                <label style={{display:"block",fontSize:12,fontWeight:600,color:NAVY,marginBottom:5}}>Notes internes</label>
                <textarea value={manualRdv.notes} onChange={e=>setManualRdv(r=>({...r,notes:e.target.value}))} placeholder="Motif du rendez-vous, informations particulières…" style={{width:"100%",border:`2px solid ${LIGHT}`,borderRadius:10,padding:"10px 12px",fontSize:13,color:NAVY,outline:"none",minHeight:70,resize:"vertical"}}/>
              </div>

              <div style={{marginBottom:20,padding:"12px 14px",background:"#FFF8E1",borderRadius:10,display:"flex",gap:10,alignItems:"center"}}>
                <input type="checkbox" id="manRec" checked={manualRdv.recurring} onChange={e=>setManualRdv(r=>({...r,recurring:e.target.checked}))} style={{width:15,height:15,accentColor:BLUE,flexShrink:0}}/>
                <label htmlFor="manRec" style={{fontSize:12,color:"#E65100",cursor:"pointer"}}>🔁 Suivi mensuel récurrent — bloquer le même créneau chaque mois</label>
              </div>

              <button onClick={saveManualRdv} disabled={manualLoading} style={{background:`linear-gradient(135deg,${BLUE},${NAVY})`,color:"#fff",border:"none",borderRadius:12,padding:"13px 28px",fontSize:14,fontWeight:700,cursor:"pointer",width:"100%"}}>
                {manualLoading ? "Enregistrement…" : "✓ Ajouter ce rendez-vous"}
              </button>
            </div>
          </div>
        )}

        {/* ─ GOOGLE CALENDAR ─ */}
        {tab==="gcal" && (
          <div>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
              <div style={{width:44,height:44,borderRadius:12,background:"linear-gradient(135deg,#4285F4,#34A853)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>📆</div>
              <div>
                <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:NAVY,margin:0}}>Synchronisation Google Agenda</h3>
                <p style={{fontSize:12,color:"#78909C",margin:0}}>Vos séances apparaîtront directement dans votre Google Calendar</p>
              </div>
            </div>

            {/* STATUS */}
            <div style={{background:gConnected?"#E8F5E9":"#fff",border:`2px solid ${gConnected?"#A5D6A7":LIGHT}`,borderRadius:16,padding:"22px 24px",marginBottom:20,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14}}>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                <div style={{width:48,height:48,borderRadius:14,background:gConnected?"#43A047":"#E0E0E0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>
                  {gConnected?"✅":"🔗"}
                </div>
                <div>
                  <div style={{fontWeight:700,color:gConnected?"#2E7D32":NAVY,fontSize:15}}>
                    {gConnected ? "Google Agenda connecté" : "Google Agenda non connecté"}
                  </div>
                  <div style={{fontSize:12,color:"#78909C"}}>
                    {gConnected ? `${gSyncedIds.length} séance${gSyncedIds.length>1?"s":""} synchronisée${gSyncedIds.length>1?"s":""}` : "Cliquez pour autoriser l'accès à votre agenda"}
                  </div>
                </div>
              </div>
              {!gConnected ? (
                <button onClick={connectGoogle} style={{background:"linear-gradient(135deg,#4285F4,#1a73e8)",color:"#fff",border:"none",borderRadius:12,padding:"12px 22px",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:18}}>G</span> Connecter Google Agenda
                </button>
              ) : (
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  <button onClick={syncAllUpcoming} disabled={gSyncing} style={{background:"linear-gradient(135deg,#34A853,#2E7D32)",color:"#fff",border:"none",borderRadius:12,padding:"12px 20px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                    {gSyncing ? "⏳ Sync en cours…" : "🔄 Sync toutes les séances à venir"}
                  </button>
                  <button onClick={()=>{setGConnected(false);setGToken(null);setGSyncedIds([]);}} style={{background:"#fff",border:`2px solid #FFCDD2`,color:"#C62828",borderRadius:12,padding:"12px 16px",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                    Déconnecter
                  </button>
                </div>
              )}
            </div>

            {gError && (
              <div style={{background:gError.startsWith("✅")?"#E8F5E9":"#FFF3E0",border:`1px solid ${gError.startsWith("✅")?"#A5D6A7":"#FFB300"}`,borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:gError.startsWith("✅")?"#2E7D32":"#E65100"}}>
