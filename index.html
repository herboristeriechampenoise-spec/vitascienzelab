            {/* EXPORT ICS */}
            <div style={{background:"#fff",borderRadius:16,padding:22,boxShadow:"0 2px 20px rgba(21,101,192,.08)",marginTop:20}}>
              <p style={{fontSize:11,fontWeight:700,color:BLUE,letterSpacing:1,marginBottom:16}}>📥 EXPORT FICHIER CALENDRIER (.ICS) — DISPONIBLE MAINTENANT</p>
              <p style={{fontSize:13,color:"#546E7A",marginBottom:18,lineHeight:1.6}}>
                Téléchargez vos séances au format <strong>.ics</strong> (compatible Google Agenda, Apple Calendrier, Outlook). Double-cliquez sur le fichier téléchargé et vos séances s'importent automatiquement.
              </p>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                <button onClick={()=>downloadICS(rdvs.filter(r=>!isExpired(r)&&r.status==="confirmed"))} style={{background:`linear-gradient(135deg,${BLUE},${NAVY})`,color:"#fff",border:"none",borderRadius:12,padding:"12px 22px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                  📥 Télécharger toutes les séances à venir
                </button>
                <button onClick={()=>downloadICS(rdvs.filter(r=>r.status==="confirmed"))} style={{background:"#fff",color:BLUE,border:`2px solid ${LIGHT}`,borderRadius:12,padding:"12px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                  📥 Télécharger tout l'historique
                </button>
              </div>
            </div>

            {/* EXPLICATION OAUTH */}
            <div style={{background:"#E8F0FE",borderRadius:14,padding:"18px 20px",marginTop:16}}>
              <p style={{fontSize:12,color:BLUE,fontWeight:700,marginBottom:8}}>ℹ️ Connexion directe Google (OAuth)</p>
              <p style={{fontSize:12,color:"#546E7A",lineHeight:1.7}}>
                La connexion OAuth directe (bouton "Connecter Google Agenda") fonctionnera automatiquement une fois l'application déployée sur votre domaine. En attendant, utilisez l'export <strong>.ics</strong> ci-dessus — c'est la méthode la plus universelle et elle fonctionne partout.
              </p>
            </div>
          </div>
        )}

        {tab==="agenda" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
              <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:NAVY}}>Agenda hebdomadaire</h3>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <button onClick={()=>setWeekOff(w=>w-1)} style={{background:LIGHT,border:"none",borderRadius:8,padding:"6px 12px",color:BLUE,fontSize:12,fontWeight:600}}>← Préc.</button>
                <span style={{fontWeight:700,color:BLUE,fontSize:12}}>{fmtShort(weekDates[0].toISOString())} – {fmtShort(weekDates[6].toISOString())}</span>
                <button onClick={()=>setWeekOff(w=>w+1)} style={{background:LIGHT,border:"none",borderRadius:8,padding:"6px 12px",color:BLUE,fontSize:12,fontWeight:600}}>Suiv. →</button>
                {weekOff!==0&&<button onClick={()=>setWeekOff(0)} style={{background:LIGHT,border:"none",borderRadius:8,padding:"6px 10px",color:BLUE,fontSize:11}}>Auj.</button>}
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
              {weekDates.map((day,i)=>{
                const iso = day.toISOString().split("T")[0];
                const isToday = new Date().toISOString().split("T")[0]===iso;
                const isSunday = day.getDay()===0;
                const dayRdvs = rdvs.filter(r=>r.rdv_date===iso&&r.status==="confirmed");
                return (
                  <div key={i} style={{background:isSunday?"#F8FAFF":"#fff",borderRadius:10,padding:"10px 8px",border:`2px solid ${isToday?BLUE:LIGHT}`,minHeight:110,opacity:isSunday?.5:1}}>
                    <div style={{textAlign:"center",marginBottom:6}}>
                      <div style={{fontSize:9,color:"#90A4AE",fontWeight:700}}>{JOURS[i===6?6:i]}</div>
                      <div style={{fontSize:15,fontWeight:700,color:isToday?BLUE:NAVY,fontFamily:"'Playfair Display',serif"}}>{day.getDate()}</div>
                    </div>
                    {isSunday ? <div style={{textAlign:"center",fontSize:9,color:"#B0BEC5"}}>Fermé</div> :
                      dayRdvs.map(r=>(
                        <div key={r.id} onClick={()=>{const pt=patients.find(p=>p.id===r.patient_id)||{id:r.patient_id,email:r.patient_email,prenom:r.patient_name?.split(" ")[0]||"",nom:r.patient_name?.split(" ").slice(1).join(" ")||"",created_at:r.created_at};openPat(pt);}} style={{background:r.service_id==="conseil"?"#E3F0FF":r.service_id==="suivi"?"#E8F5E9":"#EDE7F6",borderRadius:6,padding:"4px 6px",marginBottom:4,fontSize:10,color:NAVY,cursor:"pointer"}}>
                          <div style={{fontWeight:700}}>{r.slot}</div>
                          <div style={{opacity:.8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.service_icon} {r.patient_name?.split(" ")[0]}</div>
                        </div>
                      ))
                    }
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* SÉANCES */}
        {tab==="rdvs" && (
          <div>
            <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
              {[["all","Toutes"],["upcoming","À venir"],["today","Aujourd'hui"],["reminder","Rappels 48h"],["cancelled","Annulées"]].map(([v,l])=>(
                <button key={v} onClick={()=>setFilter(v)} style={{padding:"7px 13px",borderRadius:20,border:`2px solid ${filter===v?BLUE:"#E0E0E0"}`,background:filter===v?BLUE:"#fff",color:filter===v?"#fff":"#546E7A",fontSize:12,fontWeight:600}}>{l}</button>
              ))}
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher…" style={{...inIS,flex:1,minWidth:140}}/>
            </div>
            {filteredRdvs.length===0 ? <p style={{textAlign:"center",color:"#90A4AE",padding:30}}>Aucune séance trouvée.</p> :
              filteredRdvs.map(rdv=>(
                <div key={rdv.id} style={{background:"#fff",borderRadius:14,padding:"16px 18px",marginBottom:10,boxShadow:"0 2px 10px rgba(21,101,192,.06)",borderLeft:`4px solid ${rdv.status==="cancelled"?"#FFCDD2":need48(rdv)?"#FF8F00":isExpired(rdv)?"#CFD8DC":BLUE}`,opacity:rdv.status==="cancelled"?.7:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
                    <div>
                      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:5}}>
                        <span style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:NAVY,fontWeight:700}}>{rdv.patient_name}</span>
                        <Badge>{rdv.service_icon} {rdv.service_title}</Badge>
                        {rdv.status==="cancelled"&&<Badge bg="#FCE4EC" color="#C62828">✗ Annulé</Badge>}
                        {need48(rdv)&&<Badge bg="#FFF3E0" color="#E65100">⏰ Rappel 48h</Badge>}
                        {rdv.recurring&&<Badge bg="#FFF8E1" color="#F57F17">🔁</Badge>}
                      </div>
                      <div style={{fontSize:12,color:"#546E7A"}}>📅 {fmtLong(rdv.rdv_date)} · 🕐 {rdv.slot} · 📧 {rdv.patient_email}</div>
                      {rdv.notes&&<div style={{fontSize:11,color:"#78909C",marginTop:3,fontStyle:"italic"}}>💬 {rdv.notes}</div>}
                      {rdv.docs?.length>0&&<div style={{marginTop:5,display:"flex",gap:6,flexWrap:"wrap"}}>{rdv.docs.map(d=><Badge key={d} bg="#F3E5F5" color="#6A1B9A">📎 {d}</Badge>)}</div>}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end"}}>
                      <span style={{fontFamily:"monospace",fontSize:10,color:"#90A4AE"}}>{rdv.id}</span>
                      <button onClick={()=>{setEmailModal(rdv);setEmailType("confirm");}} style={{background:LIGHT,border:"none",color:BLUE,borderRadius:7,padding:"5px 10px",fontSize:11,fontWeight:600}}>📧 Aperçu</button>
                      {need48(rdv)&&<button onClick={()=>{setEmailModal(rdv);setEmailType("48h");}} style={{background:"#FFF3E0",border:"none",color:"#E65100",borderRadius:7,padding:"5px 10px",fontSize:11,fontWeight:600}}>⏰ Rappel</button>}
                      {need48(rdv)&&<button onClick={()=>markSent(rdv)} style={{background:"#E8F5E9",border:"none",color:"#2E7D32",borderRadius:7,padding:"5px 10px",fontSize:11}}>✓ Envoyé</button>}
                      <button onClick={()=>deleteRdv(rdv)} style={{background:"#FCE4EC",border:"none",color:"#C62828",borderRadius:7,padding:"5px 10px",fontSize:11,fontWeight:600}}>🗑 Supprimer</button>
                    </div>
                  </div>
                </div>
              ))
            }
          </div>
        )}

        {/* PATIENTS */}
        {tab==="patients" && !selPat && (
          <div>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher un patient…" style={{...inIS,marginBottom:16}}/>
            {patients
              .filter(p=>!search||`${p.prenom} ${p.nom} ${p.email}`.toLowerCase().includes(search.toLowerCase()))
              .map(pt=>{
                const pRdvs=rdvs.filter(r=>r.patient_id===pt.id);
                const next=pRdvs.filter(r=>!isExpired(r)&&r.status==="confirmed").sort((a,b)=>a.rdv_date.localeCompare(b.date))[0];
                const last=pRdvs.filter(r=>isExpired(r)).sort((a,b)=>b.date.localeCompare(a.rdv_date))[0];
                const initials = ((pt.prenom||"?")[0]+(pt.nom||"?")[0]).toUpperCase();
                return (
                  <div key={pt.id} onClick={()=>openPat(pt)} style={{background:"#fff",borderRadius:14,padding:"16px 18px",marginBottom:10,boxShadow:"0 2px 10px rgba(21,101,192,.06)",display:"flex",alignItems:"center",gap:14,cursor:"pointer",flexWrap:"wrap"}}>
                    <div style={{width:42,height:42,borderRadius:12,background:`linear-gradient(135deg,${BLUE},#42A5F5)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,color:"#fff",fontWeight:700,fontFamily:"'Playfair Display',serif",flexShrink:0}}>
                      {initials}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:NAVY}}>{pt.prenom} {pt.nom}</div>
                      <div style={{fontSize:12,color:"#78909C"}}>{pt.email} · {pRdvs.length} séance{pRdvs.length>1?"s":""}</div>
                    </div>
                    <div style={{textAlign:"right",fontSize:11}}>
                      {next&&<div style={{color:"#2E7D32"}}>Prochain : {fmtShort(next.rdv_date)}</div>}
                      {last&&<div style={{color:"#78909C"}}>Dernier : {fmtShort(last.rdv_date)}</div>}
                    </div>
                  </div>
                );
              })
            }
          </div>
        )}

        {/* FICHE PATIENT */}
        {tab==="fiche" && selPat && (
          <div>
            <button onClick={()=>{setTab("patients");setSelPat(null);}} style={{background:"#fff",border:`2px solid ${LIGHT}`,color:BLUE,borderRadius:10,padding:"8px 16px",fontSize:13,fontWeight:600,marginBottom:16}}>← Liste patients</button>
            <div style={{background:`linear-gradient(135deg,${NAVY},${BLUE})`,borderRadius:16,padding:"20px 24px",marginBottom:20,display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
              <div style={{width:50,height:50,borderRadius:12,background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:"#fff",fontFamily:"'Playfair Display',serif",fontWeight:700}}>
                {((selPat.prenom||"?")[0]+(selPat.nom||"?")[0]).toUpperCase()}
              </div>
              <div>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#fff"}}>{selPat.prenom} {selPat.nom}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,.7)"}}>{selPat.email}{selPat.tel?` · ${selPat.tel}`:""}</div>
              </div>
              <div style={{marginLeft:"auto",textAlign:"right"}}>
                <div style={{fontSize:22,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{patRdvs.length}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,.7)"}}>séance{patRdvs.length>1?"s":""}</div>
              </div>
            </div>

            <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(21,101,192,.06)",marginBottom:14}}>
              <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:NAVY,marginBottom:14}}>📅 Historique des séances</h4>
              {patRdvs.length===0 ? <p style={{color:"#90A4AE",fontSize:13}}>Aucune séance.</p> :
                patRdvs.map(r=>(
                  <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid #F0F4FF`,fontSize:12,flexWrap:"wrap",gap:6}}>
                    <span><span style={{color:"#78909C"}}>{fmtShort(r.rdv_date)} à {r.slot}</span> · <strong style={{color:NAVY}}>{r.service_icon} {r.service_title}</strong> {r.status==="cancelled"&&<Badge bg="#FCE4EC" color="#C62828">Annulé</Badge>} {r.status==="completed"&&<Badge bg="#EDE7F6" color="#4527A0">Effectué</Badge>}</span>
                    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      {r.docs?.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{r.docs.map(d=><Badge key={d} bg="#F3E5F5" color="#6A1B9A">📎 {d}</Badge>)}</div>}
                      <button onClick={()=>deleteRdv(r)} style={{background:"#FCE4EC",border:"none",color:"#C62828",borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer"}}>🗑 Supprimer</button>
                    </div>
                  </div>
                ))
              }
            </div>

            {patQ.length > 0 && (
              <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(21,101,192,.06)",marginBottom:14}}>
                <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:NAVY,marginBottom:14}}>📝 Formulaires bien-être</h4>
                {patQ.map((q,qi)=>(
                  <div key={qi} style={{background:"#F8FAFF",borderRadius:10,padding:"14px 16px",marginBottom:10}}>
                    <div style={{fontSize:10,color:"#90A4AE",marginBottom:10}}>{fmtLong(q.created_at?.split("T")[0])}</div>
                    {Object.entries(q.responses||{}).map(([k,v])=>{
                      const qDef = QUESTIONS.find(x=>x.k===k);
                      if (!qDef||!v) return null;
                      return <div key={k} style={{fontSize:12,color:"#546E7A",marginBottom:4}}><strong style={{color:NAVY}}>{qDef.q.slice(0,55)}…</strong> → {v}</div>;
                    })}
                  </div>
                ))}
              </div>
            )}

            <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(21,101,192,.06)"}}>
              <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:NAVY,marginBottom:14}}>🔒 Notes privées (visibles uniquement par vous)</h4>
              <textarea value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Ajouter une note privée…" style={{width:"100%",border:`2px solid ${LIGHT}`,borderRadius:10,padding:"10px 12px",fontSize:13,color:NAVY,outline:"none",minHeight:60,resize:"vertical",marginBottom:8}}/>
              <PrimaryBtn onClick={addNote} style={{fontSize:12,padding:"8px 16px"}}>+ Ajouter</PrimaryBtn>
              {patNotes.map(n=>(
                <div key={n.id} style={{background:"#FFF8E1",borderRadius:10,padding:"12px 14px",marginTop:10,borderLeft:"3px solid #FFD54F"}}>
                  <div style={{fontSize:10,color:"#90A4AE",marginBottom:6}}>{fmtShort(n.created_at)}</div>
                  <p style={{margin:0,fontSize:13,color:"#546E7A",lineHeight:1.6}}>{n.note}</p>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* STATISTIQUES */}
        {tab==="stats" && (
          <div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:12,marginBottom:22}}>
              {[["Total séances",stats.total,"📅",BLUE],["À venir",stats.upcoming,"✅","#2E7D32"],["Rappels 48h",reminder48.length,"⏰","#E65100"],["Avec docs",stats.withDocs,"📎","#6A1B9A"],["Patients",stats.patients,"👥",NAVY],["Récurrents",stats.recurring,"🔁","#F57F17"]].map(([l,v,e,c])=>(
                <div key={l} style={{background:"#fff",borderRadius:14,padding:"16px 14px",boxShadow:"0 2px 12px rgba(21,101,192,.06)"}}>
                  <div style={{fontSize:20,marginBottom:4}}>{e}</div>
                  <div style={{fontSize:26,fontWeight:800,color:c,fontFamily:"'Playfair Display',serif"}}>{v}</div>
                  <div style={{fontSize:11,color:"#78909C"}}>{l}</div>
                </div>
              ))}
            </div>
            <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(21,101,192,.06)",marginBottom:14}}>
              <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:NAVY,marginBottom:14}}>Répartition par type de séance</h4>
              {stats.byService.map(s=>(
                <div key={s.id} style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span>{s.icon} {s.title}</span><strong>{s.count}</strong></div>
                  <div style={{background:"#E3F0FF",borderRadius:20,height:8,overflow:"hidden"}}>
                    <div style={{height:"100%",background:BLUE,width:`${rdvs.length?Math.round(s.count/rdvs.length*100):0}%`,borderRadius:20,transition:"width .5s"}}/>
                  </div>
                </div>
              ))}
            </div>
            <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(21,101,192,.06)"}}>
              <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:NAVY,marginBottom:14}}>Activité sur 6 mois</h4>
              <div style={{display:"flex",gap:10,alignItems:"flex-end",height:90}}>
                {stats.monthly.map(m=>{
                  const max=Math.max(...stats.monthly.map(x=>x.count),1);
                  return (
                    <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                      {m.count>0&&<span style={{fontSize:10,color:BLUE,fontWeight:700}}>{m.count}</span>}
                      <div style={{width:"100%",background:BLUE,borderRadius:"4px 4px 0 0",height:`${Math.round(m.count/max*64)+4}px`,minHeight:4}}/>
                      <span style={{fontSize:10,color:"#90A4AE"}}>{m.label}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* DISPONIBILITÉS */}
        {tab==="dispo" && (
          <div>
            <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(21,101,192,.06)",marginBottom:14}}>
              <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:15,color:NAVY,marginBottom:14}}>🔒 Bloquer une date ou un créneau</h4>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:10}}>
                <div><label style={{display:"block",fontSize:11,fontWeight:700,color:NAVY,marginBottom:5}}>Date *</label><input type="date" value={newBlock.date} onChange={e=>setNewBlock(b=>({...b,date:e.target.value}))} style={inIS}/></div>
                <div><label style={{display:"block",fontSize:11,fontWeight:700,color:NAVY,marginBottom:5}}>Créneau (vide = journée entière)</label>
                  <select value={newBlock.slot} onChange={e=>setNewBlock(b=>({...b,slot:e.target.value}))} style={inIS}>
                    <option value="">Toute la journée</option>
                    {SLOTS.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div style={{marginBottom:12}}><label style={{display:"block",fontSize:11,fontWeight:700,color:NAVY,marginBottom:5}}>Motif</label><input value={newBlock.reason} onChange={e=>setNewBlock(b=>({...b,reason:e.target.value}))} placeholder="Ex : Congés, Formation…" style={inIS}/></div>
              <PrimaryBtn onClick={addBlock} disabled={!newBlock.date}>Bloquer ce créneau</PrimaryBtn>
            </div>
            {blocked.length===0 ? <p style={{textAlign:"center",color:"#90A4AE",padding:20}}>Aucun créneau bloqué.</p> :
              blocked.map(b=>(
                <div key={b.id} style={{background:"#fff",borderRadius:12,padding:"14px 18px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:NAVY}}>🚫 {fmtShort(b.date)} {b.slot?`à ${b.slot}`:"— Journée entière"}</div>
                    {b.reason&&<div style={{fontSize:12,color:"#78909C"}}>{b.reason}</div>}
                  </div>
                  <button onClick={()=>delBlock(b.id)} style={{background:"#FCE4EC",border:"none",color:"#C62828",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:600}}>Supprimer</button>
                </div>
              ))
            }
          </div>
        )}
      </div>
    </div>
  );
}

/* ══ APP PRINCIPALE ══════════════════════════ */
function App() {
  const [view, setView]       = useState("home");
  const [user, setUser]       = useState(null);
  const [showLegal, setShowLegal] = useState(false);

  const login  = (u) => { setUser(u); setView("dashboard"); };
  const logout = () => { setUser(null); setView("home"); };

  if (view==="admin") return <AdminDashboard onBack={()=>setView("home")}/>;

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(180deg,#EBF0FE,#F8FAFF)"}}>
      <style>{G}</style>
      {showLegal && <LegalModal onClose={()=>setShowLegal(false)}/>}

      {/* HEADER */}
      <header style={{background:`linear-gradient(135deg,${NAVY},${BLUE})`,padding:"0 20px"}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"15px 0",gap:10,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:42,height:42,borderRadius:12,background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>⚗️</div>
            <div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:"#fff",fontWeight:700}}>VITASCIENZELAB</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,.6)"}}>Herboristerie Champenoise · Bouilly (Aube)</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {user ? (
              <>
                <span style={{fontSize:12,color:"rgba(255,255,255,.8)"}}>👤 {user.prenom}</span>
                <button onClick={()=>setView("dashboard")} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.3)",color:"#fff",borderRadius:8,padding:"6px 12px",fontSize:11}}>Mon espace</button>
                <button onClick={logout} style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",color:"rgba(255,255,255,.7)",borderRadius:8,padding:"6px 10px",fontSize:11}}>Déco.</button>
              </>
            ) : (
              <button onClick={()=>setView("auth")} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.3)",color:"#fff",borderRadius:8,padding:"7px 14px",fontSize:12}}>👤 Espace patient</button>
            )}
            <button onClick={()=>setView("admin")} style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",color:"rgba(255,255,255,.6)",borderRadius:8,padding:"6px 10px",fontSize:11}}>🔐 Admin</button>
          </div>
        </div>
      </header>

      {/* HOME */}
      {view==="home" && (
        <div style={{maxWidth:800,margin:"0 auto",padding:"44px 20px 80px"}}>
          {DEMO && (
            <div style={{background:"#FFF8E1",border:"1px solid #FFD54F",borderRadius:12,padding:"12px 16px",marginBottom:24,textAlign:"center",fontSize:12,color:"#F57F17"}}>
              🎭 <strong>Mode démo</strong> — Remplacez SB_URL et SB_KEY pour connecter Supabase
            </div>
          )}
          <div style={{textAlign:"center",marginBottom:40}}>
            <div style={{fontSize:52,marginBottom:14}}>⚗️</div>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:30,color:NAVY,marginBottom:8}}>VITASCIENZELAB</h1>
            <p style={{color:"#78909C",fontSize:13,marginBottom:6}}>Herboristerie Champenoise · Bouilly (Aube)</p>
            <p style={{color:"#546E7A",fontSize:13,lineHeight:1.7,marginBottom:28}}>
              {COMPANY.owner} · {COMPANY.role}<br/>
              Phytothérapie · Aminothérapie · Aromathérapie · Rééquilibrage Métabolique
            </p>
            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
              <PrimaryBtn onClick={()=>setView("booking")} style={{fontSize:15,padding:"14px 28px"}}>📅 Réserver une séance</PrimaryBtn>
              <SecBtn onClick={()=>setView("auth")} style={{fontSize:15,padding:"14px 28px"}}>👤 Mon espace patient</SecBtn>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:14}}>
            {SERVICES.map(s=>(
              <div key={s.id} onClick={()=>setView("booking")} style={{background:"#fff",borderRadius:16,padding:"22px 20px",boxShadow:"0 2px 16px rgba(21,101,192,.08)",cursor:"pointer",border:`2px solid ${LIGHT}`,transition:"all .2s"}}>
                <div style={{fontSize:28,marginBottom:10}}>{s.icon}</div>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:NAVY,marginBottom:6}}>{s.title}</div>
                <Badge>{s.dur}</Badge>
                <p style={{fontSize:12,color:"#90A4AE",lineHeight:1.5,marginTop:10}}>{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      )}

      {view==="auth"      && <AuthPage onAuth={login} onBack={()=>setView("home")}/>}
      {view==="dashboard" && user && <PatientDashboard user={user} onBook={()=>setView("booking")} onLogout={logout}/>}
      {view==="booking"   && <BookingFlow user={user} onDone={()=>setView(user?"dashboard":"home")}/>}

      {/* FOOTER */}
      <footer style={{background:"#fff",borderTop:`1px solid ${LIGHT}`,padding:"14px 20px",textAlign:"center"}}>
        <div style={{maxWidth:800,margin:"0 auto",display:"flex",flexWrap:"wrap",justifyContent:"center",gap:8,alignItems:"center"}}>
          <span style={{fontSize:10,color:"#B0BEC5"}}>© {new Date().getFullYear()} VITASCIENZELAB – Herboristerie Champenoise · SIRET {COMPANY.siret} · NAF {COMPANY.naf}</span>
          <span style={{color:"#CFD8DC"}}>·</span>
          <button onClick={()=>setShowLegal(true)} style={{background:"none",border:"none",color:"#90A4AE",fontSize:10,cursor:"pointer",textDecoration:"underline",padding:0}}>Mentions légales & cadre réglementaire</button>
          <span style={{color:"#CFD8DC"}}>·</span>
          <span style={{fontSize:10,color:"#B0BEC5"}}>Conseil bien-être uniquement — Ne se substitue pas à un avis médical</span>
        </div>
      </footer>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
